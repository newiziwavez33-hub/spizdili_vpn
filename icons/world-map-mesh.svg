<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#131127" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="netLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glowDot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="transparent"/>
  <circle cx="500" cy="250" r="260" fill="url(#meshGlow)"/>

  <!-- Simplified Continent Outlines (Dark Vector) -->
  <g fill="#1e1a38" opacity="0.6">
    <!-- North America -->
    <path d="M120,80 L220,70 L280,100 L300,140 L260,180 L240,240 L190,260 L160,200 L120,160 Z"/>
    <!-- South America -->
    <path d="M260,280 L330,300 L350,360 L310,440 L280,430 L250,340 Z"/>
    <!-- Europe -->
    <path d="M460,100 L560,90 L580,130 L540,170 L480,160 L450,130 Z"/>
    <!-- Africa -->
    <path d="M470,190 L570,190 L590,270 L540,380 L490,360 L460,260 Z"/>
    <!-- Asia -->
    <path d="M580,80 L780,90 L850,150 L820,230 L730,260 L650,220 L600,160 Z"/>
    <!-- Australia -->
    <path d="M760,320 L840,310 L870,360 L820,400 L760,370 Z"/>
  </g>

  <!-- Network Constellation Connections -->
  <g stroke="url(#netLine)" stroke-width="1.2" opacity="0.75" fill="none">
    <path d="M220,130 L480,120 M480,120 L540,110 M540,110 L750,180 M240,200 L310,320 M480,120 L510,240 M540,110 L680,210 M680,210 L810,340 M510,240 L530,340 M220,130 L750,180 M480,120 L310,320 M540,110 L510,240 M680,210 L750,180" stroke-dasharray="3,3"/>
  </g>

  <!-- Glowing Nodes -->
  <g fill="#00d2ff" filter="url(#glowDot)">
    <circle cx="220" cy="130" r="4"/>
    <circle cx="270" cy="160" r="3.5"/>
    <circle cx="310" cy="320" r="3.5"/>
    <circle cx="480" cy="120" r="5" fill="#38ef7d"/>
    <circle cx="510" cy="110" r="4"/>
    <circle cx="540" cy="110" r="4.5"/>
    <circle cx="510" cy="240" r="3.5"/>
    <circle cx="680" cy="210" r="4"/>
    <circle cx="750" cy="180" r="4.5"/>
    <circle cx="810" cy="340" r="3.5"/>
  </g>
</svg>